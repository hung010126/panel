    <style>
/* 1. Style cho thanh chứa nút (UL) */
    .button-bar {
        list-style: none;      /* Bỏ dấu chấm đầu dòng */
        padding: 0;
        margin: 20px 0;
        display: flex;         /* Xếp ngang */
        gap: 10px;             /* Khoảng cách giữa các nút */
        justify-content: center; /* Căn giữa (hoặc để flex-start nếu muốn căn trái) */
    }

    /* 2. Style cho từng nút (LI) */
    .btn-report {
        padding: 10px 20px;
        background-color: #e0e0e0; /* Màu nền nút chưa chọn */
        border-radius: 5px;        /* Bo tròn góc cho giống nút */
        cursor: pointer;
        font-weight: bold;
        transition: background 0.3s;
        user-select: none;
    }

    .btn-report:hover {
        background-color: #d0d0d0;
    }

    /* 3. Style khi nút được chọn (Active) */
    .btn-report.active {
        background-color: #007bff; /* Màu xanh khi chọn */
        color: white;
    }

    /* 4. Khu vực nội dung */
    .report-content {
        display: none; /* Mặc định ẩn hết */
        padding: 2px;
        margin-top: 10px;
        background: #fff;
    }

    /* Class để hiện nội dung */
    .report-content.active {
        display: block;
    }
    
    
.loader {
  border: 16px solid #f3f3f3;
  border-radius: 50%;
  border-top: 16px solid #3498db;
  width: 120px;
  height: 120px;
  -webkit-animation: spin 2s linear infinite; /* Safari */
  animation: spin 2s linear infinite;

  /* === THÊM VÀO ĐÂY === */
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* Safari */
@-webkit-keyframes spin {
 0% { -webkit-transform: rotate(0deg); }
 100% { -webkit-transform: rotate(360deg); }
}

@keyframes spin {
 0% { transform: rotate(0deg); }
 100% { transform: rotate(360deg); }
}

  .table-wrapper {
          /* Tính toán chiều cao: 100% màn hình trừ đi khoảng 180px (chiều cao của Navbar + Tiêu đề + Padding) */
    /* Bạn hãy điều chỉnh số 180px này tăng/giảm sao cho vừa khít màn hình của bạn */
    height: calc(100vh - 60px); 
    
    /* Bắt buộc có cái này để scroll xuất hiện TẠI ĐÂY thay vì scroll cả trang web */
    overflow: auto; 
    
    /* Giữ layout ổn định */
    display: block;
    width: 100%;
    background: #fff;
    border: 1px solid #ccc;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* 2. CẤU HÌNH CHO HEADER (TH) */

table thead th {
    position: sticky;
    top: 0;
    z-index: 100; /* Cao nhất để đè lên mọi thứ */
    background-color: #003f5c; 
    color: white;
    height: 45px; /* Cố định chiều cao để dễ tính toán các dòng dưới */
    box-shadow: inset 0 -1px 0 #ccc; /* Giả làm đường viền dưới */
}

/* Sửa lỗi hiển thị bảng */
table {
    width: 100%;
    border-collapse: separate; /* Đôi khi collapse làm mất sticky border */
    border-spacing: 0;
}

tr.row-grand-total td {
    position: sticky;
    /* Cách top bằng chiều cao của Header */
    top: 45px; 
    
    z-index: 90; /* Thấp hơn header, cao hơn nội dung thường */
    background-color: #f8bfbe !important; /* Màu nền bắt buộc */
    color: white;
    font-weight: bold;
   
}

/* --- 3. DÒNG TỔNG NHÂN VIÊN (Level 3) --- */
tr.row-staff-total td {
    position: sticky;
    /* Cách top = (Chiều cao Header + Chiều cao Grand Total) */
    /* 45px + 45px = 90px */
    top: 90px; 
    
    z-index: 80; /* Thấp hơn Grand Total */
    background-color: #edebe5 !important; /* Màu nền bắt buộc */
    color: #333;
    font-weight: bold;
   
}

     .table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1800px; /* Đảm bảo bảng không bị co quá nhỏ */
            font-size: 13px;
        }

      .table-wrapper  th, .table-wrapper td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: right; /* Mặc định số căn phải */
        }

        /* Header */
      .table-wrapper th {
            background-color: #003f5c;
            color: white;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Căn trái cho các cột Text (ID, Mã, Tên, NV) */
        .text-left { text-align: left !important; }
        .text-name{ text-align: left !important; 
            max-width: 300px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        
        position: sticky;
        left: 0;
    /* Tạo vách ngăn bóng đổ để phân biệt cột dính và nội dung trượt */
    box-shadow: 2px 0 5px rgba(0,0,0,0.1); 
    border-right: 1px solid #ccc;
        
        }

  thead th.text-name {
    z-index: 110 !important; /* Cao hơn tất cả */
    background-color: #003f5c; /* Màu của Header */
    /* Đảm bảo top vẫn dính (thừa hưởng từ css trước nhưng nhắc lại cho chắc) */
    top: 0; 
}

/* B. GIAO ĐIỂM: Hàng Tổng Toàn Cục + Cột 1 */
tr.row-grand-total td.text-name {
    z-index: 95 !important; /* Cao hơn hàng tổng thường (90), thấp hơn Header (110) */
    background-color: #ff6361 !important; /* Màu của Grand Total */
    /* Top đã được set là 45px ở CSS trước */
}

/* C. GIAO ĐIỂM: Hàng Tổng Nhân Viên + Cột 1 */
tr.row-staff-total td.text-name {
    z-index: 85 !important; /* Cao hơn hàng nhân viên thường (80), thấp hơn Grand Total (95) */
    background-color: #ffa600 !important; /* Màu của Staff Total */
    /* Top đã được set là 90px ở CSS trước */
}

/* D. CỘT 1 CỦA DÒNG CHI TIẾT BÌNH THƯỜNG */
tbody tr td.text-name {
    z-index: 10; /* Chỉ cần cao hơn nội dung bình thường (0) */
    background-color: #fff; /* Màu nền mặc định, KHÔNG ĐƯỢC trong suốt */
}

/* E. KHI HOVER VÀO DÒNG CHI TIẾT */
/* Fix lỗi khi hover dòng, ô sticky bị mất màu hover */
tbody tr:hover td.text-name {
    background-color: #f1f1f1;
}

        /* Hàng Tổng Toàn Cục */
        .row-grand-total {
            background-color: #f09c9c;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        /* Hàng Tổng Nhân Viên (Header nhóm) */
        .row-staff-total {
            background-color: #c7c7c7;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .row-staff-total:hover { background-color: #ffb627; }

        /* Hàng Chi Tiết */
        .row-detail { background-color: #fff; }
        .row-detail:hover { background-color: #f1f1f1; }
        
        /* Ẩn hiện */
        .hidden { display: none; }
        
        /* Icon mũi tên */
        .toggle-icon {
            display: inline-block;
            margin-right: 5px;
            transition: transform 0.2s;
        }
        .open .toggle-icon { transform: rotate(90deg); }

         /* Container chính */
        .select-container { position: relative; width: 400px; }

        /* 1. Nút hiển thị (Giờ chứa các Tags) */
        .select-btn {
            display: flex;
            min-height: 45px; /* Tự cao lên nếu nhiều tag */
            background: #fff;
            padding: 5px 10px;
            border-radius: 8px;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
            flex-wrap: wrap; /* Cho phép xuống dòng */
            gap: 5px; /* Khoảng cách giữa các tag */
        }

        .select-btn.open { border-color: #4070f4; }

        /* Placeholder khi chưa chọn gì */
        .btn-text-placeholder { color: #333; padding-left: 10px; }

        /* 2. Style cho Tag (Chip) */
        .tag {
            background: #eef3ff;
            border: 1px solid #4070f4;
            color: #4070f4;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            display: flex;
            align-items: center;
            user-select: none;
        }

        .tag .close-tag {
            margin-left: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #4070f4;
            font-size: 12px;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .tag .close-tag:hover { background: #ccd9ff; }

        /* Mũi tên (Đẩy sang phải cùng) */
        .arrow-wrapper { margin-left: auto; padding-right: 10px; }
        .arrow { transition: 0.3s; font-size: 12px; }
        .select-btn.open .arrow { transform: rotate(180deg); }

        /* 3. Danh sách thả xuống */
        .list-items {
            position: absolute;
            margin-top: 10px;
            width: 100%;
            border-radius: 8px;
            background-color: #fff;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
            display: none; 
            z-index: 1000;
            overflow: hidden;
        }

        /* Header: Gồm ô tìm kiếm và nút xóa hết */
        .dropdown-header {
            padding: 10px;
            background: #fff;
            border-bottom: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        .search-box { flex-grow: 1; }
        .search-box input {
            width: 100%; height: 35px; border: 1px solid #ddd; border-radius: 6px;
            padding: 0 10px; font-size: 14px; outline: none; box-sizing: border-box;
        }
        .search-box input:focus { border-color: #4070f4; }

        /* Nút xóa hết */
        .clear-all-btn {
            height: 35px;
            padding: 0 10px;
            background: #ffe5e5;
            color: #d32f2f;
            border: 1px solid #ffcccc;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            display: flex;
            align-items: center;
        }
        .clear-all-btn:hover { background: #ffcccc; }

        /* Danh sách cuộn */
        .options-list {
            max-height: 300px; /* Tăng chiều cao vì 1000 item */
            overflow-y: auto;
            list-style: none; margin: 0; padding: 0;
        }

        .item {
            display: flex; align-items: center; padding: 10px 15px;
            cursor: pointer; transition: 0.2s; border-bottom: 1px solid #f9f9f9;
        }
        .item:hover { background-color: #f2faff; }

        .checkbox {
            height: 18px; width: 18px; border: 1.5px solid #c0c0c0;
            border-radius: 4px; margin-right: 12px; display: flex;
            align-items: center; justify-content: center;
        }
        .item.checked .checkbox { background-color: #4070f4; border-color: #4070f4; }
        .item.checked .checkbox::after { content: "✔"; color: #fff; font-size: 12px; }
        .item.hidden { display: none; }

    </style>
